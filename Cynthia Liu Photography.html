  /* Fade in pages on load */
.page {
  opacity: 0;
  transform: translateY(10px); /* slight upward motion */
  animation: pageFadeIn 1s forwards;
}

@keyframes pageFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  function fadeInPage(page) {
    page.style.opacity = 0;
    page.style.transform = 'translateY(10px)';
    page.style.animation = 'pageFadeIn 0.6s forwards';
  }

  // Apply to the current page on load
  const currentPage = document.querySelector('.page');
  if (currentPage) fadeInPage(currentPage);

  // Observe for new pages being inserted
  const observer = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.classList && node.classList.contains('page')) {
          fadeInPage(node);
        }
      });
    });
  });

  observer.observe(document.body, { childList: true });
});

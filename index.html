<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lydia Stranathan Photography</title>
    <link rel="icon" type="image/svg+xml" href="assets/LydiaIcon.svg">
    <link rel="apple-touch-icon" href="assets/LydiaIcon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Preload hero image for faster initial load -->
    <link rel="preload" as="image" href="images/BridgetMockGrad.jpg" fetchpriority="high">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-content">
            <h1>
                <span class="name">Lydia Stranathan</span>
                <span class="subtitle">Photography</span>
            </h1>
            
            <nav>
                <a href="index.html" class="active">portfolio</a>
                <a href="about.html">about</a>
                <a href="services.html">services</a>
                <a href="https://forms.gle/VeiJUKYVcTeQzVUe9" target="_blank">interest form</a>

            <div class="contact-info">
                <div>lydia@cltnc.us <br> <a href="https://www.instagram.com/lydiastranathan/" target="_blank">instagram</a></div>
            </div>
        </div>
    </aside>
    
    <div class="page">
        <!-- Main Content -->
        <main>
            <div class="content-wrapper">
                <div class="gallery">
                    <!-- Above-the-fold images: high priority, eager loading -->
                
                    <div class="gallery-item portrait">
                        <img src="images/Cambell_unc26-29.jpg" alt="Cambell Graduation Photo" fetchpriority="high" loading="eager">

                        <img src="images/BridgetHeadshot.jpg" alt="Bridget Headshot" fetchpriority="high" loading="eager">
                    </div>
                    <!-- Below-the-fold images: lazy loading, async decoding -->
                    <div class="gallery-item landscape">
                        <img src="images/Guat_Landscape.jpg" alt="Guatemala Landscape" loading="lazy" decoding="async">
                    </div>                    
                    <div class="gallery-item portrait">
                        <img src="images/kajob1.jpg" alt="Kate and Jacob Engagement Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/kajob2.jpg" alt="Kate and Jacob Engagement Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/Gabrielle_unc26-104.jpg" alt="Gabrielle Grad Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/el_unc26-66.jpg" alt="El's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item landscape">
                        <img src="images/Mountains1.JPG" alt="Mountain Landscape" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/Nathalie_unc26-4108.jpg" alt="Nathalie's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/Mason_SeniorPhoto.jpg" alt="Mason's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/thayer1.jpg" alt="Thayer's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/Alicia_unc26-4.jpg" alt="Alicia's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item landscape">
                        <img src="images/Stockholm_buildings.jpg" alt="Stockholm Landscape" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/Thadius_unc26-40.jpg" alt="Thadius's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/avery2.JPG" alt="Avery's Senior Photo" loading="lazy" decoding="async">
                    </div>                   
                    <div class="gallery-item landscape">
                        <img src="images/Enchantedrock1.jpeg" alt="Landscape of Enchanted Rock" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/olivia1.jpg" alt="Olivia's Senior Photo" loading="lazy" decoding="async">
                    </div>
                    <div class="gallery-item portrait">
                        <img src="images/BridgetR_unc26-4042.jpg" alt="Bridget's Senior Photo" loading="lazy" decoding="async">
                    </div>
                </div>
            </div>
        </main>
        
    </script>
</body>
</html>
